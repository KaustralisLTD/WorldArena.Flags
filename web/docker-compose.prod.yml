version: '3.8'

services:
  flags-world-web:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: flags-world-web-prod
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      - NODE_ENV=production
    volumes:
      - ./logs:/var/log/nginx
    networks:
      - flags-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  flags-network:
    driver: bridge 