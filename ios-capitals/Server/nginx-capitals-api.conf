# Add ONLY inside the capital.worldarena.games HTTPS server block.
location /api/ {
    proxy_pass http://127.0.0.1:3002;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
location /profile/ { proxy_pass http://127.0.0.1:3002; }
location = /.well-known/apple-app-site-association { proxy_pass http://127.0.0.1:3002; }
